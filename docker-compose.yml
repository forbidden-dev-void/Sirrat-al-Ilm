# ---------------------------------------------------------------------------
# Sirrat al-Ilm — production-shaped local stack
# ---------------------------------------------------------------------------
#   docker compose up --build      -> app on http://localhost:8000
#
# Copy .env.example to .env first and set at least JWT_SECRET_KEY, ADMIN_EMAIL
# and (for development) ADMIN_SEED_PASSWORD. Values in `environment` below win
# over the file, so the app always talks to the `db` service.
# ---------------------------------------------------------------------------

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sirrat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-sirrat_al_ilm}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sirrat} -d ${POSTGRES_DB:-sirrat_al_ilm}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    # Uncomment to reach the database from a client on the host:
    # ports:
    #   - "5432:5432"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Always override the database URL so it points at the compose network.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-sirrat}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-sirrat_al_ilm}
      ENVIRONMENT: ${ENVIRONMENT:-production}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      # Keeps generated SQLite files (if you ever switch back) across restarts.
      - appdata:/app/backend/data

volumes:
  pgdata:
  appdata:
