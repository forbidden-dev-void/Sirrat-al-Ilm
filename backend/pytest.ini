# ---------------------------------------------------------------------------
# pytest configuration for the FastAPI backend
#
# Run from the backend/ directory:   pytest      (or `make test` at the root)
# `pythonpath = .` makes `import app.*` and `import tests.*` work without
# installing the package first.
# ---------------------------------------------------------------------------
[pytest]
testpaths = tests
pythonpath = .
addopts = -ra --strict-markers --tb=short
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
log_cli = false
